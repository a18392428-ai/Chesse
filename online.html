<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - أونلاين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 15px; padding-bottom: 25px;
        }

        h2 { 
            margin: 0; font-size: 19px; text-align: center; color: #a855f7; 
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            animation: fadeInDown 0.7s ease-out;
        }

        .container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 20px;
            animation: zoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 20px;
        }

        .btn-option {
            background: linear-gradient(135deg, #1f1f1f, #252525);
            border: 1px solid #383838; padding: 22px; border-radius: 14px;
            width: 100%; max-width: 320px; text-align: center; text-decoration: none;
            color: white; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); transition: 0.3s;
        }
        .btn-option:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.8); border-color: #a855f7; }

        #status {
            font-size: 13px; background: linear-gradient(135deg, #1f1f1f, #252525); 
            border: 1px solid #383838; color: #e2e8f0;
            padding: 10px 18px; border-radius: 12px; text-align: center; max-width: 90vw; margin-bottom: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        .controls { 
            display: flex; gap: 8px; width: 90vw; max-width: 350px;
        }

        .btn-action {
            flex: 1; padding: 12px 10px; border-radius: 12px; border: none; font-size: 13px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            color: white;
        }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); }

        .btn-settings { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .btn-back { background: linear-gradient(135deg, #4b5563, #374151); }

        /* --- تصميم نافذة الشات الأونلاين --- */
        .chat-fab {
            position: fixed; bottom: 20px; left: 20px;
            width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white; border: none; font-size: 20px;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.5);
            cursor: pointer; z-index: 1000; transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-fab:active { transform: scale(0.9); }

        .chat-badge {
            position: absolute; top: -2px; right: -2px;
            background: #ef4444; color: white; font-size: 11px;
            padding: 2px 6px; border-radius: 10px; font-weight: bold;
            border: 2px solid #0d0d0d;
        }
        .chat-badge.hidden { display: none; }

        .chat-modal {
            position: fixed; bottom: 80px; left: 20px;
            width: 310px; height: 390px; background: #141416;
            border: 1px solid #3f3f46; border-radius: 16px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); z-index: 1001;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-modal.hidden { opacity: 0; pointer-events: none; transform: translateY(20px) scale(0.95); }

        .chat-header {
            background: #1f1f23; padding: 12px 16px; color: #a855f7;
            font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #27272a;
        }
        .chat-header button { background: none; border: none; color: #a1a1aa; font-size: 20px; cursor: pointer; }

        .chat-messages {
            flex-grow: 1; padding: 10px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }
        .msg {
            max-width: 82%; padding: 8px 12px; border-radius: 12px;
            font-size: 13px; line-height: 1.4; word-break: break-word;
        }
        .msg.system { background: #27272a; color: #a1a1aa; text-align: center; max-width: 100%; font-size: 11px; border-radius: 8px; }
        .msg.sent { background: #a855f7; color: #ffffff; align-self: flex-start; border-bottom-right-radius: 2px; font-weight: bold; }
        .msg.received { background: #27272a; color: #e4e4e7; align-self: flex-end; border-bottom-left-radius: 2px; }

        .quick-emotes {
            display: flex; gap: 6px; padding: 8px; background: #18181b;
            overflow-x: auto; border-top: 1px solid #27272a;
        }
        .quick-emotes button {
            background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46;
            padding: 5px 10px; border-radius: 20px; font-size: 12px;
            white-space: nowrap; cursor: pointer; transition: 0.2s;
        }
        .quick-emotes button:hover { background: #a855f7; color: #fff; border-color: #a855f7; }

        .chat-input-area {
            display: flex; padding: 8px; background: #141416; border-top: 1px solid #27272a; gap: 6px;
        }
        .chat-input-area input {
            flex-grow: 1; background: #1f1f23; border: 1px solid #3f3f46;
            color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none;
        }
        .chat-input-area input:focus { border-color: #a855f7; }
        .chat-input-area button {
            background: #a855f7; color: #ffffff; border: none;
            padding: 0 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

        </a>
    </div>
