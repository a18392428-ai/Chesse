<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - أونلاين</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background-color: #1e1e1e; color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 15px; padding-bottom: 20px;
        }
        h2 { margin: 0; font-size: 18px; text-align: center; }
        .board-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        #board { width: 320px; max-width: 82vw; max-height: 82vw; }
        #status {
            font-size: 14px; background: #333;
            padding: 6px 12px; border-radius: 6px; text-align: center; max-width: 90vw; margin-bottom: 8px;
        }
        .controls { display: flex; gap: 8px; }
        button, input, .btn-back {
            padding: 8px 14px; border-radius: 5px; border: none; font-size: 14px; font-family: Tahoma;
        }
        button { background: #4CAF50; color: white; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; text-align: center; width: 200px; }
        .menu-box { background: #252525; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; width: 260px; margin-bottom: 10px; }
        .selectable-code {
            background: #2a2a2a; color: #4CAF50; border: 1px solid #555; 
            text-align: center; width: 220px; padding: 6px; border-radius: 5px; 
            font-family: monospace; font-size: 15px; font-weight: bold; margin-top: 5px;
            user-select: text !important;
        }
        .btn-undo { background: #f0ad4e; color: white; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- شاشة إعداد الأونلاين -->
    <div id="setupScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%;">
        <h2>الشطرنج الأونلاين 🌐</h2>
        <div class="menu-box" style="margin-top: 15px; margin-bottom: 10px;">
            <p style="margin:0 0 8px 0; font-size:13px;">أنشئ غرفة وشارك الكود:</p>
            <button onclick="createRoom()" style="width: 100%; justify-content: center;"><i class="fa-solid fa-plus"></i> إنشاء غرفة</button>
        </div>
        <div class="menu-box" style="margin-bottom: 15px;">
            <p style="margin:0 0 8px 0; font-size:13px;">انضم لغرفة صديق:</p>
            <input type="text" id="roomCodeInput" placeholder="اكتب كود الغرفة هنا">
            <button onclick="joinRoom()" style="margin-top: 8px; width: 100%; justify-content: center; background: #0275d8;"><i class="fa-solid fa-right-to-bracket"></i> انضمام</button>
        </div>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-house"></i> رجوع للقائمة الرئيسية</a>
    </div>

    <!-- شاشة اللعب أونلاين -->
    <div id="gameScreen" class="hidden" style="display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 100%;">
        <h2>شطرنج أونلاين</h2>
        <div class="board-container">
            <div id="roomInfo" style="font-size: 13px; color: #ddd; margin-bottom: 5px; text-align: center;"></div>
            <div id="board"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div id="status">جاري الاتصال...</div>
            <div class="controls">
                <button class="btn-undo" onclick="undoMove()"><i class="fa-solid fa-rotate-left"></i> تراجع</button>
                <a href="index.html" class="btn-back" style="background: #d9534f;"><i class="fa-solid fa-house"></i> خروج ورجوع</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        var board = null, game = new Chess(), peer = null, conn = null, myColor = '';
        
        function updateStatus() {
            var moveColor = (game.turn() === 'w') ? 'الأبيض' : 'الأسود';
            var status = game.in_checkmate() ? `كش ملك!` : game.in_draw() ? 'تعادل!' : `الدور على: ${moveColor} ${game.turn() === myColor ? '(دورك)' : '(انتظار الخصم)'} ${game.in_check() ? '(كش!)' : ''}`;
            $('#status').text(status);
        }

        function createRoom() {
            peer = new Peer();
            peer.on('open', function(id) {
                myColor = 'w';
                $('#setupScreen').addClass('hidden');
                $('#gameScreen').removeClass('hidden');
                $('#roomInfo').html(`كود الغرفة (اضغط لتحديده ونسخه):<br><input type="text" class="selectable-code" value="${id}" readonly onclick="this.select();">`);
                initBoard('white');
                $('#status').text('في انتظار انضمام صديق...');
            });
            peer.on('connection', function(c) {
                conn = c; 
                setupConnection();
                $('#status').text('انضم الخصم! دور الأبيض.');
            });
        }

        function joinRoom() {
            var roomId = $('#roomCodeInput').val().trim();
            if (!roomId) { alert('اكتب الكود الأول!'); return; }
            peer = new Peer();
            peer.on('open', function(id) {
                conn = peer.connect(roomId);
                setupConnection();
                myColor = 'b';
                $('#setupScreen').addClass('hidden');
                $('#gameScreen').removeClass('hidden');
                $('#roomInfo').text('متصل بصديقك بنجاح');
                initBoard('black');
                $('#status').text('تم الاتصال! في انتظار نقلة الأبيض...');
            });
        }

        function setupConnection() {
            conn.on('open', function() {
                console.log("تم فتح قناة الاتصال بنجاح!");
            });
            conn.on('data', function(data) {
                if (data.type === 'move') {
                    // تنفيذ النقلة الواردة وتحديث اللوحة بالـ FEN بشكل مباشر
                    game.move(data.move);
                    board.position(game.fen());
                    updateStatus();
                } else if (data.type === 'undo') {
                    game.undo();
                    game.undo();
                    board.position(game.fen());
                    updateStatus();
                }
            });
        }

        function onDrop(source, target) {
            // التحقق من أن الدور دور اللاعب الحالي وأن الاتصال مفعل
            if (game.turn() !== myColor || !conn) return 'snapback';
            
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            // إرسال تفاصيل النقلة للطرف الآخر
            conn.send({ type: 'move', move: move });
            board.position(game.fen());
            updateStatus();
        }

        function initBoard(orientation) {
            game.reset();
            board = Chessboard('board', {
                draggable: true, 
                position: 'start', 
                orientation: orientation,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/alpha/{piece}.png',
                onDragStart: function(source, piece) {
                    if (game.game_over() || game.turn() !== myColor || (myColor === 'w' && piece.search(/^b/) !== -1) || (myColor === 'b' && piece.search(/^w/) !== -1)) return false;
                },
                onDrop: onDrop, 
                onSnapEnd: function() { 
                    board.position(game.fen()); 
                }
            });
            updateStatus();
        }

        function undoMove() {
            if (!conn) return;
            game.undo(); 
            game.undo(); 
            board.position(game.fen()); 
            updateStatus();
            conn.send({ type: 'undo' });
        }
    </script>
</body>
</html>
