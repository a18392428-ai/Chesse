<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - أونلاين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 15px; padding-bottom: 25px;
        }

        h2 { 
            margin: 0; font-size: 19px; text-align: center; color: #a855f7; 
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            animation: fadeInDown 0.7s ease-out;
        }

        .container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 20px;
            animation: zoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 20px;
        }

        .btn-option {
            background: linear-gradient(135deg, #1f1f1f, #252525);
            border: 1px solid #383838; padding: 22px; border-radius: 14px;
            width: 100%; max-width: 320px; text-align: center; text-decoration: none;
            color: white; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); transition: 0.3s;
        }
        .btn-option:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.8); border-color: #a855f7; }

        #status {
            font-size: 13px; background: linear-gradient(135deg, #1f1f1f, #252525); 
            border: 1px solid #383838; color: #e2e8f0;
            padding: 10px 18px; border-radius: 12px; text-align: center; max-width: 90vw; margin-bottom: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        .controls { 
            display: flex; gap: 12px; width: 85vw; max-width: 330px;
        }

        .btn-back {
            flex: 1; padding: 12px 16px; border-radius: 12px; border: none; font-size: 14px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
            background: linear-gradient(135deg, #4b5563, #374151); color: white; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .btn-back:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2><i class="fa-solid fa-globe"></i> اللعب أونلاين</h2>
    
    <div class="container">
        <a href="online-create.html" class="btn-option">
            <i class="fa-solid fa-plus-circle" style="color: #a855f7; font-size: 22px;"></i> إنشاء غرفة جديدة
        </a>
        <a href="online-join.html" class="btn-option">
            <i class="fa-solid fa-right-to-bracket" style="color: #22c55e; font-size: 22px;"></i> الانضمام إلى غرفة
        </a>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div id="status">اختر طريقة اللعب للمتابعة</div>
        <div class="controls">
            <a href="index.html" class="btn-back"><i class="fa-solid fa-house"></i> القائمة الرئيسية</a>
        </div>
    </div>
</body>
</html>
