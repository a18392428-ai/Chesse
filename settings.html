<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إعدادات اللعبة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 20px; padding-bottom: 25px;
        }

        h2 { 
            margin: 0; font-size: 20px; text-align: center; color: #a855f7; 
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            animation: fadeInDown 0.7s ease-out;
        }

        .container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 15px;
            animation: zoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 20px;
            max-width: 350px;
        }

        .setting-card {
            background: linear-gradient(135deg, #1f1f1f, #252525);
            border: 1px solid #383838; padding: 15px 20px; border-radius: 14px;
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .setting-card:hover { border-color: #a855f7; }

        .setting-info {
            display: flex; align-items: center; gap: 12px;
        }
        .setting-info i { font-size: 18px; color: #a855f7; width: 24px; text-align: center; }
        .setting-info span { font-size: 14px; color: #e2e8f0; font-weight: bold; }

        /* تصميم زر التبديل (Switch) */
        .switch {
            position: relative; display: inline-block; width: 48px; height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151; transition: .4s; border-radius: 26px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #a855f7; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* تصميم القوائم المنسدلة (Select) للإعدادات الأخرى */
        select {
            background: #121212; color: white; border: 1px solid #444; padding: 6px 10px;
            border-radius: 8px; font-size: 12px; font-family: Tahoma; outline: none; cursor: pointer;
            transition: 0.3s;
        }
        select:focus { border-color: #a855f7; }

        .controls { 
            display: flex; gap: 12px; width: 85vw; max-width: 330px;
            animation: fadeInUp 0.7s ease-out 0.4s backwards;
        }

        .btn-back {
            flex: 1; padding: 12px 16px; border-radius: 12px; border: none; font-size: 14px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
            background: linear-gradient(135deg, #4b5563, #374151); color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .btn-back:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style> اهتمام
</head>
<body>

    <h2><i class="fa-solid fa-gear"></i> إعدادات اللعبة</h2>
    
    <div class="container">
        <!-- إعداد الصوت -->
        <div class="setting-card">
            <div class="setting-info">
                <i class="fa-solid fa-volume-high"></i>
                <span>صوت النقلات</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="soundToggle" checked onchange="saveSettings()">
                <span class="slider"></span>
            </label>
        </div>

        <!-- إعداد شكل القطع -->
        <div class="setting-card">
            <div class="setting-info">
                <i class="fa-solid fa-chess-knight"></i>
                <span>شكل القطع</span>
            </div>
            <select id="pieceThemeSelect" onchange="saveSettings()">
                <option value="alpha">كلاسيكي (Alpha)</option>
                <option value="wikipedia">ويكيبيديا</option>
            </select>
        </div>

        <!-- إعداد الاهتزاز (مفيد للموبايل) -->
        <div class="setting-card">
            <div class="setting-info">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>الاهتزاز عند النقل</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="vibrateToggle" checked onchange="saveSettings()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="controls">
        <a href="online.html" class="btn-back" style="width: 100%;"><i class="fa-solid fa-arrow-right"></i> رجوع للرئيسية</a>
    </div>

    <script>
        // تحميل الإعدادات المحفوظة مسبقاً عند فتح الصفحة
        window.onload = function() {
            if (localStorage.getItem('chess_sound') !== null) {
                document.getElementById('soundToggle').checked = localStorage.getItem('chess_sound') === 'true';
            }
            if (localStorage.getItem('chess_vibrate') !== null) {
                document.getElementById('vibrateToggle').checked = localStorage.getItem('chess_vibrate') === 'true';
            }
            if (localStorage.getItem('chess_theme') !== null) {
                document.getElementById('pieceThemeSelect').value = localStorage.getItem('chess_theme');
            }
        };

        // حفظ الإعدادات في الـ localStorage عشان تسمع في باقي الصفحات
        function saveSettings() {
            const soundEnabled = document.getElementById('soundToggle').checked;
            const vibrateEnabled = document.getElementById('vibrateToggle').checked;
            const pieceTheme = document.getElementById('pieceThemeSelect').value;

            localStorage.setItem('chess_sound', soundEnabled);
            localStorage.setItem('chess_vibrate', vibrateEnabled);
            localStorage.setItem('chess_theme', pieceTheme);
        }
    </script>
</body>
</html>
