<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج أونلاين - القائمة الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }

        .card {
            background: linear-gradient(135deg, #1f1f1f, #252525);
            border: 1px solid #383838; padding: 25px; border-radius: 16px;
            width: 100%; max-width: 330px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            animation: zoomIn 0.4s ease-out;
        }

        h1 { margin-top: 0; font-size: 20px; color: #a855f7; text-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }
        .welcome-user { font-size: 13px; color: #22c55e; margin-bottom: 20px; font-weight: bold; }

        .btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 13px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-direction: row-reverse; gap: 8px; margin-top: 10px; text-decoration: none; color: white; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-create { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-join { background: linear-gradient(135deg, #a855f7, #9333ea); }
        .btn-spectate { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-back { background: #333; font-size: 11px; padding: 9px; margin-top: 15px; }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1><i class="fa-solid fa-chess"></i> القائمة الرئيسية</h1>
        <div id="welcomeText" class="welcome-user">مهلاً بك</div>

        <button class="btn btn-create" onclick="window.location.href='online-create.html'"><i class="fa-solid fa-plus-circle"></i> إنشاء غرفة جديدة (المضيف)</button>
        <button class="btn btn-join" onclick="window.location.href='online-join.html'"><i class="fa-solid fa-right-to-bracket"></i> انضمام للعب (لاعب)</button>
        <button class="btn btn-spectate" onclick="window.location.href='online-spectate.html'"><i class="fa-solid fa-eye"></i> مراقبة الجيم (مشاهد)</button>
        
        <button class="btn btn-back" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-right"></i> تغير الاسم</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const username = localStorage.getItem('chess_username');
            if (!username) {
                window.location.href = 'index.html';
                return;
            }
            // تعرض اسم المستخدم الذي قام بالتسجيل فقط بدون أي أسماء ثابته
            document.getElementById('welcomeText').innerText = `أهلاً بك، ${username} ✨`;
        });
    </script>
</body>
</html>
