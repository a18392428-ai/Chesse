<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - انضمام للعب (لاعب)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #121212; color: white;
            font-family: Tahoma, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; padding: 10px; background: #1f1f1f; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        .role-badge { background: #a855f7; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .back-btn { background: #333; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .main-container { flex: 1; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        #status { font-size: 13px; color: #eab308; margin-bottom: 8px; text-align: center; }
        
        .board-box {
            width: 320px; height: 320px; background: #262626; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; border: 2px solid #383838;
            font-size: 13px; color: #aaa; text-align: center; padding: 20px;
        }

        .chat-box {
            width: 100%; max-width: 350px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 10px; margin-top: 10px; display: flex; flex-direction: column; height: 110px;
        }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 8px; font-size: 11px; outline: none; text-align: right; }
        .chat-input-area button { background: #a855f7; border: none; color: white; padding: 0 15px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='menu.html'"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        <div style="font-size: 13px;" id="myName">لاعب</div>
        <div class="role-badge"><i class="fa-solid fa-chess-pawn"></i> لاعب (أسود)</div>
    </header>

    <div class="main-container">
        <div id="status">جاري الاتصال بغرفة المضيف...</div>
        
        <div class="board-box" id="boardArea">
            [ لوحة الشطرنج - جاهز للعب بالقطع السوداء ]
        </div>

        <div class="chat-box">
            <div class="chat-messages" id="chatMessages">
                <div style="color: #777;">شات الغرفة (لاعب)...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('chess_username') || 'لاعب';
        const roomCode = localStorage.getItem('chess_join_code');
        document.getElementById('myName').innerText = username;

        if (!roomCode) {
            alert('خطأ: لا يوجد كود غرفة!');
            window.location.href = 'menu.html';
        }

        let peer = null;
        let hostConnection = null;

        function initJoinPeer() {
            peer = new Peer({
                config: {
                    'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                hostConnection = peer.connect(roomCode);

                hostConnection.on('open', () => {
                    document.getElementById('status').innerText = 'تم الاتصال بالغرفة بنجاح (لاعب)!';
                    document.getElementById('status').style.color = '#22c55e';
                    appendSystemMessage('تم الانضمام كلاعب أساسي.');
                    
                    // إخبار المضيف بوجود اللاعب الجديد
                    hostConnection.send({ type: 'join_player', sender: username });
                });

                hostConnection.on('data', (data) => {
                    if (data.type === 'chat') {
                        appendChatMessage(data.sender, data.text);
                    } else if (data.type === 'move') {
                        console.log('مستقبل نقلة من المضيف:', data.move);
                    }
                });

                hostConnection.on('close', () => {
                    document.getElementById('status').innerText = 'تم إغلاق الغرفة من المضيف.';
                    document.getElementById('status').style.color = '#ef4444';
                });
            });

            peer.on('error', () => {
                document.getElementById('status').innerText = 'تعذر الاتصال بالغرفة.';
                document.getElementById('status').style.color = '#ef4444';
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !hostConnection || !hostConnection.open) return;

            appendChatMessage(username, text);
            hostConnection.send({ type: 'chat', sender: `${username} (لاعب)`, text: text });
            input.value = '';
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.innerHTML = `<b style="color: #a855f7;">${sender}:</b> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.style.color = '#eab308';
            div.style.fontStyle = 'italic';
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', initJoinPeer);
    </script>
</body>
</html>
