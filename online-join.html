<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الانضمام إلى غرفة</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 15px; padding-bottom: 25px;
        }

        h2 { 
            margin: 0; font-size: 19px; text-align: center; color: #a855f7; 
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            animation: fadeInDown 0.7s ease-out;
        }

        .container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 15px;
            animation: zoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 20px;
        }

        .card {
            background: linear-gradient(135deg, #1f1f1f, #252525);
            border: 1px solid #383838; padding: 20px; border-radius: 14px;
            width: 100%; max-width: 330px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .card h3 { margin-top: 0; font-size: 15px; color: #e2e8f0; margin-bottom: 12px; }

        .input-group { display: flex; gap: 8px; margin-top: 12px; }

        input[type="text"] {
            flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #444;
            background: #121212; color: white; font-size: 13px; text-align: center;
            outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: #a855f7; box-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }

        #board-wrapper {
            display: none; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%;
        }

        #board { 
            width: 310px; max-width: 82vw; max-height: 82vw; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 15px rgba(168, 85, 247, 0.2);
            border: 2px solid #2a2a2a; min-height: 280px; background: #262626;
        }

        .white-1e1d7 { background-color: #262626 !important; }
        .black-3c85d { background-color: #121212 !important; }

        .highlight-check {
            background-color: rgba(239, 68, 68, 0.85) !important;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.6);
            transition: background-color 0.3s ease;
        }

        #status {
            font-size: 13px; background: linear-gradient(135deg, #1f1f1f, #252525); 
            border: 1px solid #383838; color: #e2e8f0;
            padding: 10px 18px; border-radius: 12px; text-align: center; max-width: 90vw; margin-bottom: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            animation: fadeInUp 0.7s ease-out 0.2s backwards;
            transition: all 0.3s ease;
        }

        .status-alert {
            background: linear-gradient(135deg, #dc2626, #991b1b) !important;
            border-color: #f87171 !important; color: #fff !important; font-weight: bold; font-size: 14px !important;
            animation: pulseAlert 1.5s infinite alternate;
        }

        .controls { display: flex; gap: 8px; width: 90vw; max-width: 350px; animation: fadeInUp 0.7s ease-out 0.4s backwards; z-index: 10; }

        button, .btn-action {
            flex: 1; padding: 11px 8px; border-radius: 12px; border: none; font-size: 12px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.4); color: white;
        }
        button:hover, .btn-action:hover { transform: translateY(-2px); }

        .btn-start { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-main { background: linear-gradient(135deg, #a855f7, #9333ea); width: 100%; }
        .btn-settings { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .btn-back { background: linear-gradient(135deg, #ef4444, #dc2626); }

        /* --- الشات العائم المطور --- */
        .chat-fab {
            position: fixed; bottom: 20px; left: 20px; width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #7c3aed); color: white; border: none; font-size: 22px;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.6); cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center;
        }

        .chat-badge { position: absolute; top: -2px; right: -2px; background: #ef4444; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: bold; border: 2px solid #0d0d0d; }
        .chat-badge.hidden { display: none; }

        .chat-modal {
            position: fixed; bottom: 80px; left: 20px; width: 310px; height: 390px; background: #141416;
            border: 1px solid #3f3f46; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); z-index: 10000; transition: all 0.3s;
        }
        .chat-modal.hidden { opacity: 0; pointer-events: none; transform: translateY(20px) scale(0.95); }

        .chat-header { background: #1f1f23; padding: 12px 16px; color: #a855f7; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; }
        .chat-header button { background: none; border: none; color: #a1a1aa; font-size: 20px; cursor: pointer; }

        .chat-messages { flex-grow: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 13px; word-break: break-word; }
        .msg.system { background: #27272a; color: #a1a1aa; text-align: center; max-width: 100%; font-size: 11px; }
        .msg.sent { background: #a855f7; color: white; align-self: flex-start; font-weight: bold; }
        .msg.received { background: #27272a; color: #e4e4e7; align-self: flex-end; }

        .quick-emotes { display: flex; gap: 6px; padding: 8px; background: #18181b; overflow-x: auto; border-top: 1px solid #27272a; }
        .quick-emotes button { background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; padding: 5px 10px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }

        .chat-input-area { display: flex; padding: 8px; background: #141416; border-top: 1px solid #27272a; gap: 6px; }
        .chat-input-area input { flex-grow: 1; background: #1f1f23; border: 1px solid #3f3f46; color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; }
        .chat-input-area button { background: #a855f7; color: white; border: none; padding: 0 14px; border-radius: 8px; cursor: pointer; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulseAlert { 0% { transform: scale(1); box-shadow: 0 0 10px rgba(220, 38, 38, 0.5); } 100% { transform: scale(1.02); box-shadow: 0 0 20px rgba(248, 113, 113, 0.8); } }
    </style>
</head>
<body>

    <h2><i class="fa-solid fa-right-to-bracket"></i> الانضمام إلى غرفة</h2>
    
    <div class="container" id="menu-container">
        <div class="card">
            <h3>أدخل كود صديقك للاتصال</h3>
            <div class="input-group">
                <input type="text" id="joinCodeInput" placeholder="أدخل الكود هنا...">
                <button class="btn-main" onclick="joinRoom()"><i class="fa-solid fa-plug"></i> انضمام</button>
            </div>
        </div>
    </div>

    <div id="board-wrapper">
        <div id="board"></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div id="status">اكتب الكود واضغط انضمام للبدء</div>
        <div class="controls">
            <button class="btn-start" onclick="startNewRound()"><i class="fa-solid fa-rotate-right"></i> جولة جديدة</button>
            <a href="settings.html" class="btn-action btn-settings"><i class="fa-solid fa-gear"></i> الإعدادات</a>
            <a href="online.html" class="btn-action btn-back" onclick="leaveRoom()"><i class="fa-solid fa-house"></i> القائمة</a>
        </div>
    </div>

    <!-- زر الشات العائم -->
    <button id="chat-toggle-btn" class="chat-fab" onclick="toggleChat()">
        <i class="fa-solid fa-comments"></i>
        <span id="chat-badge" class="chat-badge hidden">0</span>
    </button>

    <!-- نافذة الشات -->
    <div id="chat-modal" class="chat-modal hidden">
        <div class="chat-header">
            <span><i class="fa-solid fa-comments"></i> شات الغرفة</span>
            <button onclick="toggleChat()">&times;</button>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <div class="msg system">جاهز للشات عند الاتصال بالمنافس! ♟️</div>
        </div>

        <div class="quick-emotes">
            <button onclick="sendQuickMsg('😂')">😂</button>
            <button onclick="sendQuickMsg('🔥')">🔥</button>
            <button onclick="sendQuickMsg('👏')">👏</button>
            <button onclick="sendQuickMsg('كش ملك! 👑')">كش ملك! 👑</button>
            <button onclick="sendQuickMsg('جيم حلو! ♟️')">جيم حلو!</button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="اكتب رسالتك..." maxlength="100">
            <button onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <audio id="moveSound" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move.mp3" preload="auto"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <script>
        var peer = null, conn = null;
        var board = null, game = new Chess();
        var gameStarted = false;
        var moveAudio = document.getElementById('moveSound');

        // --- دوال الشات العامة (Global Functions) ---
        window.toggleChat = function() {
            const chatModal = document.getElementById('chat-modal');
            const chatBadge = document.getElementById('chat-badge');
            if (chatModal) {
                chatModal.classList.toggle('hidden');
                if (!chatModal.classList.contains('hidden') && chatBadge) {
                    chatBadge.textContent = '0';
                    chatBadge.classList.add('hidden');
                }
            }
        };

        window.addMessage = function(text, type = 'sent') {
            const chatMessages = document.getElementById('chat-messages');
            if (chatMessages) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `msg ${type}`;
                msgDiv.textContent = text;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        };

        window.handleSend = function() {
            const chatInput = document.getElementById('chat-input');
            if (!chatInput) return;
            const text = chatInput.value.trim();
            if (text) {
                addMessage(text, 'sent');
                chatInput.value = '';
                if (conn && conn.open) {
                    conn.send({ type: 'chat', message: text });
                }
            }
        };

        window.sendQuickMsg = function(text) {
            addMessage(text, 'sent');
            if (conn && conn.open) {
                conn.send({ type: 'chat', message: text });
            }
        };

        function receiveChatMessage(text) {
            addMessage(text, 'received');
            const chatModal = document.getElementById('chat-modal');
            const chatBadge = document.getElementById('chat-badge');
            if (chatModal && chatModal.classList.contains('hidden') && chatBadge) {
                let count = parseInt(chatBadge.textContent || '0') + 1;
                chatBadge.textContent = count;
                chatBadge.classList.remove('hidden');
            }
        }

        // إرسال بالضغط على زر Enter
        document.addEventListener('DOMContentLoaded', function() {
            const chatInput = document.getElementById('chat-input');
            if (chatInput) {
                chatInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') handleSend();
                });
            }
        });

        // --- دوال اللعبة والشبكة ---
        function playSound() {
            const soundEnabled = localStorage.getItem('chess_sound') !== 'false';
            if (soundEnabled && moveAudio) {
                moveAudio.currentTime = 0;
                moveAudio.play().catch(e => {});
            }
        }

        function highlightCheck() {
            $('#board .square-55d63').removeClass('highlight-check');
            if (game.in_check()) {
                var boardFen = game.board();
                var kingSquare = null;

                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        let piece = boardFen[r][c];
                        if (piece && piece.type === 'k' && piece.color === game.turn()) {
                            let files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
                            let ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
                            kingSquare = files[c] + ranks[r];
                            break;
                        }
                    }
                    if (kingSquare) break;
                }

                if (kingSquare) {
                    $('#board .square-' + kingSquare).addClass('highlight-check');
                }
            }
        }

        window.joinRoom = function() {
            const code = $('#joinCodeInput').val().trim();
            if (!code) {
                alert('الرجاء إدخال كود الغرفة أولاً!');
                return;
            }
            $('#status').text('جاري الاتصال بالغرفة...');
            
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
                startGameSession();
            });
            peer.on('error', () => {
                $('#status').text('فشل الاتصال! تأكد من صحة الكود.');
            });
        };

        function setupConnection() {
            conn.on('open', () => {
                $('#status').text('تم الاتصال بنجاح! انتظر بدء الجولة من الخصم.');
                addMessage('تم الاتصال بالغرفة بنجاح! بالتوفيق.', 'system');
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    game.move(data.move);
                    board.position(game.fen());
                    playSound();
                    updateStatusText();
                } else if (data.type === 'chat') {
                    receiveChatMessage(data.message);
                } else if (data.type === 'start') {
                    resetLocalBoard();
                    addMessage('بدأت جولة جديدة بطلب من المنافس!', 'system');
                }
            });

            conn.on('close', () => {
                gameStarted = false;
                $('#status').text('انقطع الاتصال مع الخصم!');
                addMessage('غادر المنافس الغرفة.', 'system');
            });
        }

        function startGameSession() {
            $('#menu-container').hide();
            $('#board-wrapper').css('display', 'flex');
            
            var savedTheme = localStorage.getItem('chess_theme') || 'alpha';
            var themeUrl = savedTheme === 'wikipedia' 
                ? 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
                : 'https://chessboardjs.com/img/chesspieces/alpha/{piece}.png';

            var config = {
                draggable: true,
                position: 'start',
                orientation: 'black',
                pieceTheme: themeUrl,
                onDrop: onDropPiece,
                onSnapEnd: function() { 
                    board.position(game.fen());
                    highlightCheck();
                }
            };
            board = Chessboard('board', config);
            updateStatusText();
        }

        window.startNewRound = function() {
            if (!conn || !conn.open) {
                alert('لم يتم الاتصال بالغرفة بعد!');
                return;
            }
            resetLocalBoard();
            conn.send({ type: 'start' });
            addMessage('تمت إعادة بدء الجولة في نفس الغرفة!', 'system');
        };

        function resetLocalBoard() {
            game.reset();
            if (board) {
                board.start();
                board.orientation('black');
            }
            gameStarted = true;
            updateStatusText();
        }

        window.leaveRoom = function() {
            if (conn) conn.close();
            if (peer) peer.destroy();
        };

        function onDropPiece(source, target) {
            if (!conn || !conn.open || !gameStarted) return 'snapback';
            if (game.turn() !== 'b') return 'snapback';

            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            playSound();
            board.position(game.fen());
            updateStatusText();

            if (conn && conn.open) {
                conn.send({ type: 'move', move: { from: source, to: target, promotion: 'q' } });
            }
        }

        function updateStatusText() {
            var moveColor = (game.turn() === 'b') ? 'الأسود' : 'الأبيض';
            var $status =$('#status');
            
            $status.removeClass('status-alert');

            if (game.in_checkmate()) {
                var winner = moveColor === 'الأسود' ? 'الأبيض' : 'الأسود';
                $status.html(`<i class="fa-solid fa-crown"></i> كش ملك! الفائز هو <b>${winner}</b> (اضغط جولة جديدة للإعادة)`).addClass('status-alert');
            } else if (game.in_draw()) {
                $status.html('<i class="fa-solid fa-handshake"></i> تعادل! انتهت اللعبة (اضغط جولة جديدة للإعادة).').addClass('status-alert');
            } else {
                var turnText = (game.turn() === 'b') ? 'الأسود (دورك)' : 'الأبيض (انتظار الخصم...)';
                var checkText = game.in_check() ? ' <span style="color: #f87171; font-weight: bold;">(تحذير: كش!)</span>' : '';
                $status.html(turnText + checkText);
            }

            highlightCheck();
        }
    </script>
</body>
</html>
