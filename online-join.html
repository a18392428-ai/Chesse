<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الانضمام إلى غرفة</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 15px; padding-bottom: 25px;
        }

        h2 { 
            margin: 0; font-size: 19px; text-align: center; color: #a855f7; 
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            animation: fadeInDown 0.7s ease-out;
        }

        .container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 15px;
            animation: zoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 20px;
        }

        .card {
            background: linear-gradient(135deg, #1f1f1f, #252525);
            border: 1px solid #383838; padding: 20px; border-radius: 14px;
            width: 100%; max-width: 330px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .card h3 { margin-top: 0; font-size: 15px; color: #e2e8f0; margin-bottom: 12px; }

        .input-group {
            display: flex; gap: 8px; margin-top: 12px;
        }

        input {
            flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #444;
            background: #121212; color: white; font-size: 13px; text-align: center;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: #a855f7; box-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }

        #board-wrapper {
            display: none; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%;
        }

        #board { 
            width: 310px; max-width: 82vw; max-height: 82vw; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 15px rgba(168, 85, 247, 0.2);
            border: 2px solid #2a2a2a;
        }

        .white-1e1d7 { background-color: #262626 !important; }
        .black-3c85d { background-color: #121212 !important; }

        #status {
            font-size: 13px; background: linear-gradient(135deg, #1f1f1f, #252525); 
            border: 1px solid #383838; color: #e2e8f0;
            padding: 10px 18px; border-radius: 12px; text-align: center; max-width: 90vw; margin-bottom: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            animation: fadeInUp 0.7s ease-out 0.2s backwards;
        }

        .controls { 
            display: flex; gap: 12px; width: 85vw; max-width: 330px;
            animation: fadeInUp 0.7s ease-out 0.4s backwards;
        }

        button, .btn-back {
            flex: 1; padding: 12px 16px; border-radius: 12px; border: none; font-size: 14px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        button:hover, .btn-back:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
        }

        .btn-main { background: linear-gradient(135deg, #a855f7, #9333ea); color: white; padding: 10px 16px; }
        .btn-back { background: linear-gradient(135deg, #4b5563, #374151); color: white; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2><i class="fa-solid fa-right-to-bracket"></i> الانضمام إلى غرفة</h2>
    
    <div class="container" id="menu-container">
        <div class="card">
            <h3>أدخل كود صديقك للاتصال</h3>
            <div class="input-group">
                <input type="text" id="joinCodeInput" placeholder="أدخل الكود هنا...">
                <button class="btn-main" onclick="joinRoom()"><i class="fa-solid fa-plug"></i> انضمام</button>
            </div>
        </div>
    </div>

    <div id="board-wrapper">
        <div id="board"></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div id="status">اكتب الكود واضغط انضمام للبدء</div>
        <div class="controls">
            <a href="online.html" class="btn-back" style="width: 100%;"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
        </div>
    </div>

    <!-- عناصر الصوت المحلية -->
    <audio id="moveSound" src="move.mp3" preload="auto"></audio>
    <audio id="checkSound" src="check.mp3" preload="auto"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <script>
        var peer = null, conn = null;
        var board = null, game = new Chess();
        var moveAudio = document.getElementById('moveSound');
        var checkAudio = document.getElementById('checkSound');

        // كسر حظر التشغيل التلقائي للمتصفح عند أول ضغطة
        document.addEventListener('click', function initAudio() {
            [moveAudio, checkAudio].forEach(audio => {
                if (audio) {
                    audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(e => {});
                }
            });
            document.removeEventListener('click', initAudio);
        }, { once: true });

        // دالة ذكية لتشغيل الصوت والاهتزاز بناءً على حالة الكش
        function playCustomSound(isCheck) {
            const soundEnabled = localStorage.getItem('chess_sound') !== 'false';
            if (!soundEnabled) return;

            const vibrateEnabled = localStorage.getItem('chess_vibrate') !== 'false';

            if (isCheck && checkAudio) {
                checkAudio.currentTime = 0;
                checkAudio.play().catch(e => {});
                if (vibrateEnabled && navigator.vibrate) {
                    navigator.vibrate([60, 40, 60]);
                }
            } else if (moveAudio) {
                moveAudio.currentTime = 0;
                moveAudio.play().catch(e => {});
                if (vibrateEnabled && navigator.vibrate) {
                    navigator.vibrate(40);
                }
            }
        }

        function joinRoom() {
            const code = $('#joinCodeInput').val().trim();
            if (!code) {
                alert('الرجاء إدخال كود الغرفة أولاً!');
                return;
            }
            $('#status').text('جاري الاتصال بالغرفة...');
            
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                
                conn.on('open', () => {
                    $('#status').text('تم الاتصال بنجاح! انتظر دور الخصم (أنت تلعب بالأسود).');
                    startGameSession();
                });

                conn.on('data', (data) => {
                    if (data.type === 'move') {
                        game.move(data.move);
                        board.position(game.fen());
                        // تشغيل الصوت عند استقبال حركة الخصم وفحص الكش
                        playCustomSound(game.in_check());
                        updateStatusText();
                    }
                });

                conn.on('close', () => {
                    $('#status').text('انقطع الاتصال مع الخصم!');
                });
            });

            peer.on('error', () => {
                $('#status').text('فشل الاتصال! تأكد من صحة الكود.');
            });
        }

        function startGameSession() {
            $('#menu-container').hide();
            $('#board-wrapper').css('display', 'flex');
            
            var config = {
                draggable: true,
                position: 'start',
                orientation: 'black', // المنضم يلعب بالأسود
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/alpha/{piece}.png',
                onDrop: onDropPiece,
                onSnapEnd: function() { board.position(game.fen()); }
            };
            board = Chessboard('board', config);
            updateStatusText();
        }

        function onDropPiece(source, target) {
            if (game.turn() !== 'b') return 'snapback';

            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            // تشغيل الصوت محلياً عند تحريك القطعة مع فحص الكش
            playCustomSound(game.in_check());
            board.position(game.fen());
            updateStatusText();

            if (conn && conn.open) {
                conn.send({ type: 'move', move: { from: source, to: target, promotion: 'q' } });
            }
        }

        function updateStatusText() {
            var turnText = (game.turn() === 'b') ? 'الأسود (دورك)' : 'الأبيض (انتظار الخصم...)';
            if (game.in_checkmate()) turnText = 'كش ملك! انتهت اللعبة.';
            else if (game.in_draw()) turnText = 'تعادل!';
            else if (game.in_check()) turnText += ' (كش!)';
            $('#status').text(turnText);
        }
    </script>
</body>
</html>
