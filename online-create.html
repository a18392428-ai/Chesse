<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - إنشاء غرفة (المضيف)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #121212; color: white;
            font-family: Tahoma, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; padding: 10px; background: #1f1f1f; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        .role-badge { background: #22c55e; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; color: black; }
        .back-btn { background: #333; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .main-container { flex: 1; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        #status { font-size: 13px; color: #eab308; margin-bottom: 8px; text-align: center; }
        
        .setup-box {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px;
            width: 100%; max-width: 330px; text-align: center; margin-bottom: 10px;
        }
        .setup-box input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
            background: #121212; color: white; font-size: 13px; text-align: center; outline: none;
            margin-top: 8px; direction: ltr;
        }
        .setup-box input::placeholder { direction: rtl; }
        .create-btn {
            background: #22c55e; color: black; border: none; padding: 10px; width: 100%;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 13px;
        }

        .board-box {
            width: 280px; height: 280px; background: #262626; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; border: 2px solid #383838;
            font-size: 12px; color: #aaa; text-align: center; padding: 15px; display: none;
        }

        .chat-box {
            width: 100%; max-width: 350px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 10px; margin-top: 10px; display: flex; flex-direction: column; height: 100px; display: none;
        }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 8px; font-size: 11px; outline: none; text-align: right; }
        .chat-input-area button { background: #22c55e; color: black; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='menu.html'"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        <div style="font-size: 13px;" id="myName">المضيف</div>
        <div class="role-badge"><i class="fa-solid fa-chess-king"></i> المضيف (أبيض)</div>
    </header>

    <div class="main-container">
        <div id="status">أدخل كوداً مميزاً لإنشاء الغرفة</div>
        
        <!-- صندوق إدخال الكود اليدوي -->
        <div class="setup-box" id="setupBox">
            <label style="font-size: 12px; color: #ccc;"><i class="fa-solid fa-key"></i> اختر كود الغرفة (مثال: room123):</label>
            <input type="text" id="customRoomCode" placeholder="اكتب الكود هنا..." autocomplete="off">
            <button class="create-btn" onclick="createCustomRoom()">إنشاء الغرفة الآن</button>
        </div>

        <div class="board-box" id="boardArea">
            [ لوحة الشطرنج - المضيف (أبيض) ]
        </div>

        <div class="chat-box" id="chatContainer">
            <div class="chat-messages" id="chatMessages">
                <div style="color: #777;">شات الغرفة (المضيف)...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('chess_username') || 'المضيف';
        document.getElementById('myName').innerText = username;

        let peer = null;
        let connectedPlayers = [];

        function createCustomRoom() {
            const input = document.getElementById('customRoomCode');
            const roomCode = input.value.trim();

            if (!roomCode) {
                alert('الرجاء إدخال كود الغرفة أولاً!');
                return;
            }

            document.getElementById('status.innerText') = 'جاري حجز الغرفة...';

            // إنشاء اتصال Peer باستخدام الكود اليدوي للمضيف
            peer = new Peer(roomCode, {
                config: {
                    'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                // الكود متاح وتم حجزه بنجاح
                document.getElementById('status').innerText = `تم إنشاء الغرفة بنجاح! الكود: ${id}`;
                document.getElementById('status').style.color = '#22c55e';
                
                // إخفاء خانة الإدخال وإظهار اللوحة والشات
                document.getElementById('setupBox').style.display = 'none';
                document.getElementById('boardArea').style.display = 'flex';
                document.getElementById('chatContainer').style.display = 'flex';

                appendSystemMessage(`تم فتح الغرفة بالكود (${id}). بانتظار انضمام اللاعب أو المشاهدين...`);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('عذراً، هذا الكود مستخدم بالفعل من قِبل شخص آخر! اختر كوداً آخر.');
                    document.getElementById('status').innerText = 'الكود مستخدم، جرب كوداً آخر.';
                    document.getElementById('status').style.color = '#ef4444';
                } else {
                    alert('حدث خطأ: ' + err.type);
                }
            });

            // استقبال اتصالات اللاعبين أو المشاهدين
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'join_player') {
                        appendSystemMessage(`انضم اللاعب: ${data.sender} للعب.`);
                        connectedPlayers.push(conn);
                    } else if (data.type === 'join_spectator') {
                        appendSystemMessage(`انضم المشاهد: ${data.sender} للمراقبة.`);
                        connectedPlayers.push(conn);
                    } else if (data.type === 'chat') {
                        appendChatMessage(data.sender, data.text);
                        broadcastMessage(data, conn);
                    }
                });
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            appendChatMessage(`${username} (المضيف)`, text);
            
            const messageData = { type: 'chat', sender: `${username} (المضيف)`, text: text };
            broadcastMessage(messageData);
            
            input.value = '';
        }

        function broadcastMessage(data, excludeConn = null) {
            connectedPlayers.forEach(conn => {
                if (conn !== excludeConn && conn.open) {
                    conn.send(data);
                }
            });
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.innerHTML = `<b style="color: #22c55e;">${sender}:</b> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.style.color = '#eab308';
            div.style.fontStyle = 'italic';
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
