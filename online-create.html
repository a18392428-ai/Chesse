<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج أونلاين - إنشاء غرفة (المضيف)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة قواعد الشطرنج -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #121212; color: white;
            font-family: Tahoma, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; padding: 10px; background: #1f1f1f; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10;
        }
        .role-badge { background: #22c55e; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; color: black; }
        .back-btn { background: #333; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .main-container { flex: 1; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; position: relative; }
        #status { font-size: 12px; color: #eab308; margin-bottom: 8px; text-align: center; }
        
        .setup-box {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px;
            width: 100%; max-width: 320px; text-align: center;
        }
        .setup-box input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
            background: #121212; color: white; font-size: 13px; text-align: center; outline: none;
            margin-top: 8px; direction: ltr;
        }
        .setup-box input::placeholder { direction: rtl; }
        .create-btn {
            background: #22c55e; color: black; border: none; padding: 10px; width: 100%;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 13px;
        }

        /* حاوية لوحة الشطرنج الحقيقية */
        #boardContainer {
            width: 340px; height: 340px; display: grid; grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr); border: 3px solid #383838; border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); display: none;
        }
        .square {
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; cursor: pointer; position: relative;
        }
        .light { background: #f0d9b5; color: #000; }
        .dark { background: #b58863; color: #000; }
        .square.selected { background: #7b61ff !important; }
        
        /* نقطة تتبع الحركة */
        .move-dot {
            width: 14px; height: 14px; background: rgba(0, 255, 0, 0.7);
            border-radius: 50%; position: absolute; pointer-events: none;
            box-shadow: 0 0 6px rgba(0,255,0,0.9);
        }

        /* زر الشات العائم */
        #floatingChatBtn {
            position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px;
            background: #22c55e; color: black; border-radius: 50%; border: none;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100; display: none;
        }
        #floatingChatBtn .badge {
            position: absolute; top: -2px; right: -2px; background: #ef4444; color: white;
            font-size: 9px; padding: 2px 5px; border-radius: 50%; display: none;
        }

        /* نافذة الشات العائمة */
        #chatModal {
            position: fixed; bottom: 80px; left: 20px; width: 280px; height: 300px;
            background: #1a1a1a; border: 1px solid #444; border-radius: 12px;
            display: none; flex-direction: column; z-index: 99; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .chat-header {
            background: #262626; padding: 8px 12px; display: flex; justify-content: space-between;
            align-items: center; border-top-left-radius: 12px; border-top-right-radius: 12px; font-size: 11px;
        }
        .close-chat { background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
        .chat-input-area { display: flex; border-top: 1px solid #333; padding: 4px; background: #121212; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 6px; font-size: 11px; outline: none; text-align: right; }
        .chat-input-area button { background: #22c55e; color: black; border: none; padding: 0 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='menu.html'"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        <div style="font-size: 12px;" id="myName">المضيف</div>
        <div class="role-badge"><i class="fa-solid fa-chess-king"></i> المضيف (أبيض)</div>
    </header>

    <div class="main-container">
        <div id="status">أدخل كود الغرفة لبدء المعركة</div>
        
        <div class="setup-box" id="setupBox">
            <label style="font-size: 11px; color: #ccc;"><i class="fa-solid fa-key"></i> كود الغرفة:</label>
            <input type="text" id="customRoomCode" placeholder="اكتب الكود هنا..." autocomplete="off">
            <button class="create-btn" onclick="createCustomRoom()">إنشاء الغرفة واللعب</button>
        </div>

        <!-- البورد التفاعلي الحقيقي -->
        <div id="boardContainer"></div>
    </div>

    <!-- زر الشات العائم -->
    <button id="floatingChatBtn" onclick="toggleChat()">
        <i class="fa-solid fa-comments"></i>
        <span class="badge" id="chatBadge">0</span>
    </button>

    <!-- صندوق الشات العائم المنبثق -->
    <div id="chatModal">
        <div class="chat-header">
            <span><b>شات الغرفة</b></span>
            <button class="close-chat" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="color: #777; font-style: italic;">أهلاً بك في الشات العائم...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button onclick="sendChatMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('chess_username') || 'المضيف';
        document.getElementById('myName').innerText = username;

        let peer = null;
        let connectedPlayers = [];
        let chess = new Chess(); // محرك الشطرنج
        let selectedSquare = null;
        let unreadMessages = 0;

        // رموز القطع الشطرنجية بـ Unicode
        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function createCustomRoom() {
            const roomCode = document.getElementById('customRoomCode').value.trim();
            if (!roomCode) { alert('الرجاء إدخال كود الغرفة أولاً!'); return; }

            document.getElementById('status').innerText = 'جاري حجز الغرفة...';

            peer = new Peer(roomCode, {
                config: { 'iceServers': [{ url: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                document.getElementById('status').innerText = `الغرفة جاهزة! الكود: ${id}`;
                document.getElementById('status').style.color = '#22c55e';
                
                document.getElementById('setupBox').style.display = 'none';
                document.getElementById('boardContainer').style.display = 'grid';
                document.getElementById('floatingChatBtn').style.display = 'flex';

                renderBoard();
                appendSystemMessage(`تم فتح الغرفة بنجاح (${id}). بانتظار الخصم...`);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('الكود مستخدم بالفعل! اختر كوداً آخر.');
                    document.getElementById('status').innerText = 'الكود مستخدم.';
                } else {
                    alert('خطأ في الاتصال: ' + err.type);
                }
            });

            peer.on('connection', (conn) => {
                connectedPlayers.push(conn);
                conn.on('open', () => {
                    appendSystemMessage('انضم الخصم إلى الغرفة!');
                });
                conn.on('data', (data) => {
                    if (data.type === 'move') {
                        chess.move(data.move);
                        renderBoard();
                    } else if (data.type === 'chat') {
                        appendChatMessage(data.sender, data.text);
                        if (document.getElementById('chatModal').style.display !== 'flex') {
                            unreadMessages++;
                            const badge = document.getElementById('chatBadge');
                            badge.innerText = unreadMessages;
                            badge.style.display = 'inline-block';
                        }
                    }
                });
            });
        }

        // رسم لوحة الشطرنج ونظام النقاط للدلالة على الحركة
        function renderBoard() {
            const container = document.getElementById('boardContainer');
            container.innerHTML = '';
            const board = chess.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareDiv = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    squareDiv.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    const file = String.fromCharCode(97 + c);
                    const rank = 8 - r;
                    const squareId = file + rank;

                    if (squareId === selectedSquare) {
                        squareDiv.classList.add('selected');
                    }

                    const piece = board[r][c];
                    if (piece) {
                        squareDiv.innerText = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase()];
                    }

                    // عرض النقاط الدائرية للحركات المتاحة
                    if (selectedSquare) {
                        const legalMoves = chess.moves({ square: selectedSquare, verbose: true });
                        if (legalMoves.some(m => m.to === squareId)) {
                            const dot = document.createElement('div');
                            dot.className = 'move-dot';
                            squareDiv.appendChild(dot);
                        }
                    }

                    squareDiv.onclick = () => handleSquareClick(squareId);
                    container.appendChild(squareDiv);
                }
            }
        }

        function handleSquareClick(squareId) {
            if (!selectedSquare) {
                const piece = chess.get(squareId);
                if (piece && piece.color === 'w') { // المضيف يلعب بالأبيض
                    selectedSquare = squareId;
                    renderBoard();
                }
            } else {
                const move = chess.move({ from: selectedSquare, to: squareId, promotion: 'q' });
                if (move) {
                    renderBoard();
                    broadcastMessage({ type: 'move', move: move });
                }
                selectedSquare = null;
                renderBoard();
            }
        }

        function toggleChat() {
            const modal = document.getElementById('chatModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                unreadMessages = 0;
                document.getElementById('chatBadge').style.display = 'none';
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            appendChatMessage(`${username} (المضيف)`, text);
            const msg = { type: 'chat', sender: `${username} (المضيف)`, text: text };
            broadcastMessage(msg);
            input.value = '';
        }

        function broadcastMessage(data) {
            connectedPlayers.forEach(conn => {
                if (conn.open) conn.send(data);
            });
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.innerHTML = `<b style="color: #22c55e;">${sender}:</b> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.style.color = '#eab308';
            div.style.fontStyle = 'italic';
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
