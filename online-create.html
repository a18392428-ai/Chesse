<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - غرفة الإنشاء (المضيف)</title>
    <!-- مكتبة الشطرنج والواجهة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #121212; color: white;
            font-family: Tahoma, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; padding: 10px; background: #1f1f1f; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        .room-code-badge { background: #a855f7; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .back-btn { background: #333; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .main-container { flex: 1; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        
        #status { font-size: 13px; color: #eab308; margin-bottom: 8px; text-align: center; }
        
        /* شاشة اللوحة البسيطة أو مكان الرام */
        .board-box {
            width: 320px; height: 320px; background: #262626; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; border: 2px solid #383838;
            font-size: 14px; color: #aaa; text-align: center; padding: 20px;
        }

        /* نافذة الشات السريعة */
        .chat-box {
            width: 100%; max-width: 350px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 10px; margin-top: 10px; display: flex; flex-direction: column; height: 110px;
        }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 8px; font-size: 11px; outline: none; text-align: right; }
        .chat-input-area button { background: #a855f7; border: none; color: white; padding: 0 15px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='menu.html'"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        <div style="font-size: 13px;" id="myName">المضيف</div>
        <div class="room-code-badge" id="roomCodeDisplay">جاري التوليد...</div>
    </header>

    <div class="main-container">
        <div id="status">جاري الاتصال بالسيرفر وإنشاء الغرفة...</div>
        
        <div class="board-box" id="boardArea">
            [ لوحة الشطرنج جاهزة - في انتظار اتصال اللاعب الثاني أو المشاهدين ]
        </div>

        <div class="chat-box">
            <div class="chat-messages" id="chatMessages">
                <div style="color: #777;">مرحباً بك في الشات الجماعي للغرفة...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('chess_username') || 'المضيف';
        document.getElementById('myName').innerText = username;

        // توليد كود عشوائي قصير للغرفة
        function generateRoomCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        const roomCode = generateRoomCode();
        document.getElementById('roomCodeDisplay').innerText = `الكود: ${roomCode}`;

        let peer = null;
        let connections = []; // قائمة الاتصالات المتصلة بالمضيف (لاعبين ومراقبين)

        function initHostPeer() {
            // إعداد الـ Peer مع خوادم STUN لضمان الاتصال أونلاين بين الأجهزة المختلفة
            peer = new Peer(roomCode, {
                config: {
                    'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('status').innerText = 'الغرفة جاهزة! شارك الكود مع أصدقائك.';
                document.getElementById('status').style.color = '#22c55e';
            });

            peer.on('error', (err) => {
                console.error(err);
                document.getElementById('status').innerText = 'خطأ في الاتصال بالسيرفر، حاول مرة أخرى.';
                document.getElementById('status').style.color = '#ef4444';
            });

            // استقبال الاتصالات الواردة من اللاعبين أو المراقبين
            peer.on('connection', (conn) => {
                connections.push(conn);
                
                conn.on('open', () => {
                    appendSystemMessage(`انضم مستخدم جديد للغرفة.`);
                });

                conn.on('data', (data) => {
                    handleIncomingData(data, conn);
                });

                conn.on('close', () => {
                    connections = connections.filter(c => c !== conn);
                    appendSystemMessage(`قام أحد الأشخاص بمغادرة الغرفة.`);
                });
            });
        }

        function handleIncomingData(data, conn) {
            if (data.type === 'chat') {
                appendChatMessage(data.sender, data.text);
                // إعادة توجيه رسالة الشات لباقي المتصلين (لو فيه مراقبين تانيين)
                connections.forEach(c => {
                    if (c !== conn && c.open) c.send(data);
                });
            } else if (data.type === 'move') {
                // معالجة نقلة الشطرنج المستقبلية
                console.log('مستقبل نقلة:', data.move);
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            appendChatMessage(username, text);
            const msgData = { type: 'chat', sender: username, text: text };
            
            // إرسال الرسالة لكل المتصلين بالغرفة
            connections.forEach(c => {
                if (c.open) c.send(msgData);
            });

            input.value = '';
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.innerHTML = `<b style="color: #a855f7;">${sender}:</b> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.style.color = '#eab308';
            div.style.fontStyle = 'italic';
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // بدء التشغيل عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            initHostPeer();
        });
    </script>
</body>
</html>
