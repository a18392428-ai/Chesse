<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قائمة الشطرنج الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background-color: #1e1e1e; color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: fixed;
        }
        h2 { margin: 0 0 25px 0; font-size: 24px; text-align: center; color: #f0ad4e; }
        .menu-container {
            display: flex; flex-direction: column; gap: 15px; width: 280px; max-width: 90vw;
        }
        .menu-btn {
            padding: 14px 20px; border-radius: 8px; border: none; font-size: 16px; font-family: Tahoma;
            color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            font-weight: bold; text-decoration: none; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .menu-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-local { background: #4CAF50; }
        .btn-ai { background: #0275d8; }
        .btn-online { background: #f0ad4e; color: #1e1e1e; }
    </style>
</head>
<body>

    <h2>لعبة الشطرنج ♟️</h2>
    
    <div class="menu-container">
        <a href="local.html" class="menu-btn btn-local">
            <i class="fa-solid fa-users"></i> لاعب ضد لاعب (محلي)
        </a>
        <a href="ai.html" class="menu-btn btn-ai">
            <i class="fa-solid fa-robot"></i> لعب ضد الكمبيوتر
        </a>
        <a href="online.html" class="menu-btn btn-online">
            <i class="fa-solid fa-globe"></i> لعب أونلاين مع صديق
        </a>
    </div>

</body>
</html>
