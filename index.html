<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الشطرنج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background-color: #1e1e1e; color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        h1 { margin-bottom: 25px; font-size: 24px; color: #4CAF50; text-align: center; }
        .menu-container {
            display: flex; flex-direction: column; gap: 15px; width: 260px;
        }
        .btn-menu {
            padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 10px; text-decoration: none; color: white; transition: 0.2s;
        }
        .btn-online { background: #0275d8; }
        .btn-online:hover { background: #025aa5; }
        .btn-local { background: #4CAF50; }
        .btn-local:hover { background: #388E3C; }
    </style>
</head>
<body>

    <h1><i class="fa-solid fa-chess"></i> لعبة الشطرنج</h1>

    <div class="menu-container">
        <!-- زر اللعب أونلاين (يوديك لصفحة online.html) -->
        <a href="online.html" class="btn-menu btn-online">
            <i class="fa-solid fa-globe"></i> اللعب أونلاين
        </a>
        
        <!-- زر اللعب المحلي (لو عندك صفحة للعب مع صديق بنفس الجهاز مثلاً local.html أو اتركها حسب رغبتك) -->
        <a href="online.html" class="btn-menu btn-local" onclick="alert('قريباً أو العب أونلاين حالياً!'); return false;">
            <i class="fa-solid fa-user-group"></i> لاعب ضد لاعب (محلي)
        </a>
    </div>

</body>
</html>
