<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الشطرنج - القائمة الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 25px; padding-bottom: 30px;
        }

        /* عنوان اللعبة بتصميم فخم */
        .header-title {
            text-align: center;
            animation: fadeInDown 0.7s ease-out;
        }

        h1 { 
            margin: 0; font-size: 24px; color: #f59e0b; 
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        p {
            margin: 6px 0 0 0; font-size: 13px; color: #9ca3af;
        }

        /* أزرار القائمة الرئيسية */
        .menu-container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 15px;
            animation: zoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 20px;
        }

        .btn-menu {
            background: linear-gradient(135deg, #1f1f1f, #252525);
            border: 1px solid #383838; padding: 18px; border-radius: 14px;
            width: 100%; max-width: 320px; text-align: center; text-decoration: none;
            color: white; font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-menu:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.8); 
            border-color: #555;
        }
        .btn-menu:active { transform: translateY(-1px); }

        .btn-menu i {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }

        /* تذييل الصفحة أو الحالة */
        #status {
            font-size: 13px; background: linear-gradient(135deg, #1f1f1f, #252525); 
            border: 1px solid #383838; color: #e2e8f0;
            padding: 10px 18px; border-radius: 12px; text-align: center; max-width: 90vw;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            animation: fadeInUp 0.7s ease-out 0.2s backwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1><i class="fa-solid fa-chess"></i> لعبة الشطرنج</h1>
        <p>اختر نمط اللعب للبدء</p>
    </div>
    
    <div class="menu-container">
        <a href="ai.html" class="btn-menu" style="border-color: rgba(59, 130, 246, 0.3);">
            <i class="fa-solid fa-robot" style="color: #3b82f6;"></i> اللعب ضد الكمبيوتر
        </a>
        <a href="local.html" class="btn-menu" style="border-color: rgba(34, 197, 94, 0.3);">
            <i class="fa-solid fa-users" style="color: #22c55e;"></i> لاعب ضد لاعب (محلي)
        </a>
        <a href="online.html" class="btn-menu" style="border-color: rgba(168, 85, 247, 0.3);">
            <i class="fa-solid fa-globe" style="color: #a855f7;"></i> اللعب أونلاين
        </a>
    </div>

    <div>
        <div id="status">مرحباً بك! اختر نمط اللعب المناسب لك</div>
    </div>

</body>
</html>
