<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الشطرنج - القائمة الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* أنيميشن ظهور العنوان مع حركة خفيفة للأعلى */
        .title-container {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeInDown 1s ease-out;
        }
        h1 { 
            margin: 0; font-size: 28px; color: #f0ad4e; 
            text-shadow: 0 4px 10px rgba(240, 173, 78, 0.3);
        }
        p { margin: 8px 0 0 0; font-size: 13px; color: #aaa; }

        .menu-container {
            display: flex; flex-direction: column; gap: 18px; width: 290px; max-width: 90vw;
            animation: fadeInUp 1s ease-out;
        }

        /* تصميم الأزرار مع التدرج اللوني والظل */
        .btn-menu {
            position: relative;
            padding: 16px 20px; border-radius: 12px; border: none; font-size: 16px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: flex-start;
            gap: 15px; text-decoration: none; color: white; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* أيقونات الأزرار */
        .btn-menu i {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }

        /* تأثير لمعة خفيفة تتحرك على الزر عند التحويم */
        .btn-menu::after {
            content: '';
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-menu:hover::after { left: 100%; }

        /* تأثير الضغط والتحويم */
        .btn-menu:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .btn-menu:active {
            transform: translateY(-1px);
        }

        /* ألوان وتدرجات مخصصة لكل زر */
        .btn-local { 
            background: linear-gradient(135deg, #43a047, #2e7d32); 
        }
        .btn-ai { 
            background: linear-gradient(135deg, #1e88e5, #1565c0); 
        }
        .btn-online { 
            background: linear-gradient(135deg, #fb8c00, #ef6c00); 
        }

        /* حركات الأنيميشن (Keyframes) */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1><i class="fa-solid fa-chess"></i> الشطرنج الاحترافية</h1>
        <p>اختر نمط اللعب وابدأ التحدي</p>
    </div>

    <div class="menu-container">
        <!-- 1. لاعب ضد لاعب محلي -->
        <a href="local.html" class="btn-menu btn-local">
            <i class="fa-solid fa-users"></i> لاعب ضد لاعب (محلي)
        </a>
        
        <!-- 2. اللعب ضد الكمبيوتر -->
        <a href="ai.html" class="btn-menu btn-ai">
            <i class="fa-solid fa-robot"></i> لعب ضد الكمبيوتر
        </a>

        <!-- 3. اللعب أونلاين -->
        <a href="online.html" class="btn-menu btn-online">
            <i class="fa-solid fa-globe"></i> لعب أونلاين مع صديق
        </a>
    </div>

</body>
</html>
