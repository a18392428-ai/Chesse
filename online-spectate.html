<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - مراقبة الجيم (مشاهد)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #121212; color: white;
            font-family: Tahoma, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; padding: 10px; background: #1f1f1f; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        .role-badge { background: #3b82f6; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; color: white; }
        .back-btn { background: #333; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .main-container { flex: 1; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        #status { font-size: 13px; color: #eab308; margin-bottom: 8px; text-align: center; }
        
        .setup-box {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px;
            width: 100%; max-width: 330px; text-align: center; margin-bottom: 10px;
        }
        .setup-box input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
            background: #121212; color: white; font-size: 13px; text-align: center; outline: none;
            margin-top: 8px; direction: ltr;
        }
        .setup-box input::placeholder { direction: rtl; }
        .action-btn {
            background: #3b82f6; color: white; border: none; padding: 10px; width: 100%;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 13px;
        }

        .board-box {
            width: 280px; height: 280px; background: #262626; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; border: 2px solid #383838;
            font-size: 12px; color: #aaa; text-align: center; padding: 15px; display: none;
        }

        .chat-box {
            width: 100%; max-width: 350px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 10px; margin-top: 10px; display: flex; flex-direction: column; height: 100px; display: none;
        }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 8px; font-size: 11px; outline: none; text-align: right; }
        .chat-input-area button { background: #3b82f6; color: white; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='menu.html'"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        <div style="font-size: 13px;" id="myName">مشاهد</div>
        <div class="role-badge"><i class="fa-solid fa-eye"></i> مراقب (مشاهد)</div>
    </header>

    <div class="main-container">
        <div id="status">أدخل كود الغرفة للمتابعة كـ مشاهد</div>
        
        <!-- خانة مستقلة خاصة بكود المشاهدة فقط -->
        <div class="setup-box" id="setupBox">
            <label style="font-size: 12px; color: #ccc;"><i class="fa-solid fa-key"></i> كود الغرفة للمراقبة:</label>
            <input type="text" id="spectateCodeInput" placeholder="اكتب كود الغرفة هنا..." autocomplete="off">
            <button class="action-btn" onclick="connectAsSpectator()">بدء المراقبة</button>
        </div>

        <div class="board-box" id="boardArea">
            [ لوحة الشطرنج - وضع المراقبة (رؤية فقط) ]
        </div>

        <div class="chat-box" id="chatContainer">
            <div class="chat-messages" id="chatMessages">
                <div style="color: #777;">شات الغرفة (مشاهد)...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('chess_username') || 'مشاهد';
        document.getElementById('myName').innerText = username;

        let peer = null;
        let hostConnection = null;

        function connectAsSpectator() {
            const roomCode = document.getElementById('spectateCodeInput').value.trim();
            if (!roomCode) {
                alert('الرجاء إدخال كود الغرفة أولاً!');
                return;
            }

            document.getElementById('status').innerText = `جاري الاتصال بغرفة المضيف (${roomCode})...`;

            peer = new Peer({
                config: {
                    'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                hostConnection = peer.connect(roomCode);

                hostConnection.on('open', () => {
                    document.getElementById('status').innerText = `تم الاتصال بنجاح كـ مشاهد (${roomCode})!`;
                    document.getElementById('status').style.color = '#22c55e';
                    
                    document.getElementById('setupBox').style.display = 'none';
                    document.getElementById('boardArea').style.display = 'flex';
                    document.getElementById('chatContainer').style.display = 'flex';

                    appendSystemMessage('تم الانضمام للمراقبة بنجاح.');
                    hostConnection.send({ type: 'join_spectator', sender: username });
                });

                hostConnection.on('data', (data) => {
                    if (data.type === 'chat') {
                        appendChatMessage(data.sender, data.text);
                    }
                });

                hostConnection.on('close', () => {
                    document.getElementById('status').innerText = 'تم إغلاق الغرفة من قِبل المضيف.';
                    document.getElementById('status').style.color = '#ef4444';
                });
            });

            peer.on('error', () => {
                document.getElementById('status').innerText = 'تعذر العثور على الغرفة بهذا الكود!';
                document.getElementById('status').style.color = '#ef4444';
                alert('تأكد من صحة كود الغرفة.');
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !hostConnection || !hostConnection.open) return;

            appendChatMessage(`${username} (مشاهد)`, text);
            hostConnection.send({ type: 'chat', sender: `${username} (مشاهد)`, text: text });
            input.value = '';
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.innerHTML = `<b style="color: #3b82f6;">${sender}:</b> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.style.color = '#eab308';
            div.style.fontStyle = 'italic';
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
