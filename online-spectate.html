<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج أونلاين - مراقبة الجيم (مشاهد)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة قواعد الشطرنج -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; background: #121212; color: white;
            font-family: Tahoma, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden;
        }
        header {
            width: 100%; padding: 10px; background: #1f1f1f; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10;
        }
        .role-badge { background: #3b82f6; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; color: white; }
        .back-btn { background: #333; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .main-container { flex: 1; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; position: relative; }
        #status { font-size: 12px; color: #eab308; margin-bottom: 8px; text-align: center; }
        
        .setup-box {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px;
            width: 100%; max-width: 320px; text-align: center;
        }
        .setup-box input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
            background: #121212; color: white; font-size: 13px; text-align: center; outline: none;
            margin-top: 8px; direction: ltr;
        }
        .setup-box input::placeholder { direction: rtl; }
        .action-btn {
            background: #3b82f6; color: white; border: none; padding: 10px; width: 100%;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 13px;
        }

        /* حاوية لوحة الشطرنج للمشاهد */
        #boardContainer {
            width: 340px; height: 340px; display: grid; grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr); border: 3px solid #383838; border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); display: none;
        }
        .square {
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; position: relative;
        }
        .light { background: #f0d9b5; color: #000; }
        .dark { background: #b58863; color: #000; }

        /* زر الشات العائم */
        #floatingChatBtn {
            position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px;
            background: #3b82f6; color: white; border-radius: 50%; border: none;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100; display: none;
        }
        #floatingChatBtn .badge {
            position: absolute; top: -2px; right: -2px; background: #ef4444; color: white;
            font-size: 9px; padding: 2px 5px; border-radius: 50%; display: none;
        }

        /* نافذة الشات العائمة */
        #chatModal {
            position: fixed; bottom: 80px; left: 20px; width: 280px; height: 300px;
            background: #1a1a1a; border: 1px solid #444; border-radius: 12px;
            display: none; flex-direction: column; z-index: 99; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .chat-header {
            background: #262626; padding: 8px 12px; display: flex; justify-content: space-between;
            align-items: center; border-top-left-radius: 12px; border-top-right-radius: 12px; font-size: 11px;
        }
        .close-chat { background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
        .chat-input-area { display: flex; border-top: 1px solid #333; padding: 4px; background: #121212; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 6px; font-size: 11px; outline: none; text-align: right; }
        .chat-input-area button { background: #3b82f6; color: white; border: none; padding: 0 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='menu.html'"><i class="fa-solid fa-arrow-right"></i> القائمة</button>
        <div style="font-size: 12px;" id="myName">مشاهد</div>
        <div class="role-badge"><i class="fa-solid fa-eye"></i> مراقب (مشاهد)</div>
    </header>

    <div class="main-container">
        <div id="status">أدخل كود الغرفة لمتابعة الجيم</div>
        
        <div class="setup-box" id="setupBox">
            <label style="font-size: 11px; color: #ccc;"><i class="fa-solid fa-key"></i> كود الغرفة للمراقبة:</label>
            <input type="text" id="spectateCodeInput" placeholder="اكتب الكود هنا..." autocomplete="off">
            <button class="action-btn" onclick="connectAsSpectator()">بدء المراقبة</button>
        </div>

        <!-- لوحة الشطرنج للمشاهد -->
        <div id="boardContainer"></div>
    </div>

    <!-- زر الشات العائم -->
    <button id="floatingChatBtn" onclick="toggleChat()">
        <i class="fa-solid fa-comments"></i>
        <span class="badge" id="chatBadge">0</span>
    </button>

    <!-- صندوق الشات العائم المنبثق -->
    <div id="chatModal">
        <div class="chat-header">
            <span><b>شات الغرفة (مشاهدة)</b></span>
            <button class="close-chat" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="color: #777; font-style: italic;">أهلاً بك في شات المشاهدين...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button onclick="sendChatMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('chess_username') || 'مشاهد';
        document.getElementById('myName').innerText = username;

        let peer = null;
        let hostConnection = null;
        let chess = new Chess();
        let unreadMessages = 0;

        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function connectAsSpectator() {
            const roomCode = document.getElementById('spectateCodeInput').value.trim();
            if (!roomCode) { alert('الرجاء إدخال كود الغرفة أولاً!'); return; }

            document.getElementById('status').innerText = `جاري الاتصال بالغرفة (${roomCode})...`;

            peer = new Peer({
                config: { 'iceServers': [{ url: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', () => {
                hostConnection = peer.connect(roomCode);

                hostConnection.on('open', () => {
                    document.getElementById('status').innerText = `تم الاتصال بنجاح كـ مشاهد!`;
                    document.getElementById('status').style.color = '#22c55e';
                    
                    document.getElementById('setupBox').style.display = 'none';
                    document.getElementById('boardContainer').style.display = 'grid';
                    document.getElementById('floatingChatBtn').style.display = 'flex';

                    renderBoard();
                    appendSystemMessage('تم الانضمام للمراقبة بنجاح.');
                    hostConnection.send({ type: 'join_spectator', sender: username });
                });

                hostConnection.on('data', (data) => {
                    if (data.type === 'move') {
                        chess.move(data.move);
                        renderBoard();
                    } else if (data.type === 'chat') {
