<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج - ضد الكمبيوتر</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: white; font-family: Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: fixed; padding-top: 15px; padding-bottom: 20px;
        }

        /* أنيميشن قوي ونابض للعنوان */
        h2 { 
            margin: 0; font-size: 20px; text-align: center; color: #1e88e5; 
            text-shadow: 0 0 15px rgba(30, 136, 229, 0.4);
            animation: bounceInDown 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .board-container { 
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; 
            animation: zoomInBounce 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #board { 
            width: 320px; max-width: 82vw; max-height: 82vw; border-radius: 10px; overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 20px rgba(30, 136, 229, 0.2);
            transition: transform 0.3s ease;
        }
        #board:hover {
            transform: scale(1.02);
        }

        #status {
            font-size: 14px; background: #222; border: 1px solid #444;
            padding: 10px 16px; border-radius: 10px; text-align: center; max-width: 90vw; margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: fadeInUp 0.8s ease-out 0.3s backwards;
        }

        .controls { 
            display: flex; gap: 12px; 
            animation: fadeInUp 0.8s ease-out 0.5s backwards;
        }

        button, .btn-back {
            padding: 12px 18px; border-radius: 10px; border: none; font-size: 14px; font-family: Tahoma;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        button:hover, .btn-back:hover { 
            transform: translateY(-4px) scale(1.05); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); 
        }
        button:active, .btn-back:active { transform: translateY(-1px); }

        .btn-undo { background: linear-gradient(135deg, #f0ad4e, #ec971f); color: white; }
        .btn-back { background: linear-gradient(135deg, #6c757d, #5a6268); color: white; }

        /* Keyframes للأنيميشن القوي */
        @keyframes bounceInDown {
            0% { opacity: 0; transform: translateY(-60px); }
            60% { opacity: 1; transform: translateY(15px); }
            80% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }
        @keyframes zoomInBounce {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h2><i class="fa-solid fa-robot"></i> لعب ضد الكمبيوتر</h2>
    
    <div class="board-container">
        <div id="board"></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div id="status">جاري إعداد اللعبة...</div>
        <div class="controls">
            <button class="btn-undo" onclick="undoMove()"><i class="fa-solid fa-rotate-left"></i> تراجع</button>
            <a href="index.html" class="btn-back"><i class="fa-solid fa-house"></i> القائمة</a>
        </div>
    </div>

    <!-- عنصر الصوت لتحريك القطع -->
    <audio id="moveSound" src="https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move.mp3" preload="auto"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        var board = null, game = new Chess();
        var moveAudio = document.getElementById('moveSound');

        function playSound() {
            if (moveAudio) {
                moveAudio.currentTime = 0;
                moveAudio.play().catch(e => {});
            }
        }

        function updateStatus() {
            var moveColor = (game.turn() === 'w') ? 'الأبيض (دورك)' : 'الأسود (الكمبيوتر يفكّر...)';
            if (game.in_checkmate()) moveColor = 'كش ملك! انتهت اللعبة.';
            else if (game.in_draw()) moveColor = 'تعادل!';
            else if (game.in_check()) moveColor += ' (كش!)';
            $('#status').text(moveColor);
        }

        function makeRandomMove() {
            if (game.game_over()) return;
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;
            var randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            playSound(); // صوت لحركة الكمبيوتر
            board.position(game.fen());
            updateStatus();
        }

        function onDrop(source, target) {
            if (game.turn() !== 'w') return 'snapback';
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            playSound(); // صوت لحركة اللاعب
            board.position(game.fen());
            updateStatus();
            
            if (!game.game_over()) {
                window.setTimeout(makeRandomMove, 300);
            }
        }

        var config = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/alpha/{piece}.png',
            onDrop: onDrop,
            onSnapEnd: function() { board.position(game.fen()); }
        };

        board = Chessboard('board', config);
        updateStatus();

        function undoMove() {
            game.undo();
            game.undo(); // التراجع عن نقلتك ونقلة الكمبيوتر
            board.position(game.fen());
            updateStatus();
        }
    </script>
</body>
</html>
